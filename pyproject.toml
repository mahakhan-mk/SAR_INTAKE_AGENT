[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-assessment-service"
version = "0.1.0"
description = "Backend foundation for the SAR assessment service."
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1.0",
  "asyncpg>=0.30,<1.0",
  "azure-storage-blob>=12.25,<13.0",
  "fastapi>=0.116,<1.0",
  "openai>=2.46,<3.0",
  "pydantic>=2.11,<3.0",
  "PyYAML>=6.0,<7.0",
  "python-dotenv>=1.0,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=0.24,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
