[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-assessment-service"
version = "0.1.0"
description = "Backend foundation for the SAR assessment service."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "openai>=2.46,<3.0",
  "pydantic>=2.11,<3.0",
  "PyYAML>=6.0,<7.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
